name: Build and deploy

on:
  push:
    branches:
      - '**'

jobs:
  Build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_BOT: ${{ secrets.SLACK_BOT }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      GOOGLE_CONTAINER_ID: ${{ secrets.GOOGLE_CONTAINER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: |
          rm -vrf node_modules/.cache/webpack
          yarn install
      - name: Update versions from GitHub
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node _build_scripts/update-config-versions.js
      - name: Build Docusarus project
        run: |
          yarn build
      # netlify deploy bundles the edge functions, and the bundler downloads a
      # Deno binary into ~/.config/netlify/deno-cli on first use. Cache it so
      # every run does not depend on that download; a version mismatch after a
      # netlify-cli upgrade just falls back to a fresh download.
      - name: Cache the edge-function Deno runtime
        uses: actions/cache@v4
        with:
          path: ~/.config/netlify/deno-cli
          key: ${{ runner.os }}-deno-cli-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-cli-
      - name: Deploy draft to Netlify
        timeout-minutes: 10
        run: |
          source _build_scripts/publish-draft-to-netlify.sh
      - name: Send Slack Message for branch build
        if: ${{ github.ref_name != 'main' }}
        run: |
          source _build_scripts/slack-find-author.sh
          source _build_scripts/slack-netlify-message.sh
      - name: Deploy to Production Netlify
        if: ${{ github.ref_name == 'main' }}
        timeout-minutes: 15
        run: |
          source _build_scripts/publish-prod-to-netlify.sh
          source _build_scripts/slack-find-author.sh
          source _build_scripts/slack-release-message.sh
