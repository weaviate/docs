### ==================== ERROR-MESSAGE REDIRECTOR (/e/<id>) ==================== ###
#
# Stable short links carried in error and warning messages emitted by Weaviate
# core and the client libraries, e.g. "Dep004: ... see https://docs.weaviate.io/e/py-dep004".
#
# THE ID IS THE CONTRACT. THE DESTINATION IS NOT.
# A message string ships inside a released binary and can never be changed for
# users already running it. A docs URL changes every time the IA moves. So the
# message carries only the id, and the id-to-page mapping lives here. When a page
# moves or is renamed, edit the `to` below -- that is a one-line docs change
# instead of six client releases, and readers on old client versions are fixed
# retroactively. Never delete a rule; repoint it.
#
# ID FORMAT: <origin>-<category><nnn>, lowercase.
#   origin   = py | ts | go | java | csharp | core
#   category = auth | bat | con | dep | grpc | rbac | mem | ...
# The origin prefix exists to prevent CROSS-ORIGIN collision, and that reason
# stands on its own: the categories are semantic, not proprietary, so core and
# every client will each want a "deprecation" bucket. Core would naturally reach
# for Dep0xx, and the Python client already owns 19 of them. Without the prefix
# the second origin to allocate an id collides by default.
#
# What the prefix does NOT do is fix a WITHIN-origin collision: py-con004 would
# still name two different messages. That is a separate rule, and the Python
# client is the cautionary example for it -- ids must be ASSIGNED FROM A
# REGISTRY, not harvested from whatever prefixes a client already happens to use.
#
# LOWERCASE ONLY. Netlify matches paths case-sensitively. Messages print the id
# in mixed case for readability ("Dep004:") but MUST emit the URL lowercased
# ("/e/py-dep004"). Do not add mixed-case duplicates here; fix the emitter.
#
# Adding a row: verify the target page file exists and that the anchor is a real,
# unique heading slug (or an explicit {#anchor}, or an <APITable> row id) on that
# page. Docusaurus warns rather than fails on a broken anchor, and its check only
# sees links written inside the site's own pages -- it never reads this file. So a
# bad fragment here will not fail the build. It will just 404 a user who is
# already having a bad day.
#
# DESTINATIONS ARE MIGRATING TO /errors. That section is written for exactly this
# arrival: one entry per message, with the message text, the cause and the fix on
# the page the reader lands on, no table of contents to scroll past. Ids that
# already have an entry point there. The rest still point at the nearest existing
# docs page and get repointed as their entry is written -- an approximate page
# beats no page, but a purpose-built entry beats both.

