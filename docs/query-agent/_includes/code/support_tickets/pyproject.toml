[project]
name = "reflex-weaviate-support"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "reflex>=0.10.0",
    "weaviate-client[agents]>=4.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
